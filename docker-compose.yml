services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: walnut_transactions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d walnut_transactions"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/walnut_transactions
      NODE_ENV: development
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
